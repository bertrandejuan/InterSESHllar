<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterSESHllar: Mars Gale Crater & Earth Desert Analogs</title>
  <link rel="stylesheet" href="css/style.css?v=6.1.0">
</head>
<body>

  <!-- Top Header with Refresh Button & Connection Status -->
  <header class="glass-panel header-row">
    <div class="title-area">
      <h1>
        <span class="brand-mars">Planetary Analogs:</span>
        <span>Mars & Earth</span>
      </h1>
      <div class="header-subtitle">Cooper Union Mars Gale Crater & Earth Desert Analogs</div>
    </div>
    <div class="header-controls">
      <div class="status-pill">
        <span id="dot-openspace" class="indicator-dot offline"></span>
        <span id="status-openspace">Connecting...</span>
      </div>
      <button id="btn-refresh-panel" class="btn btn-refresh" title="Reload Panel (CEF Hard Refresh)">
        🔄 Reload Panel
      </button>
      <button id="btn-orbit-return" class="btn btn-orbit" title="Return to high planetary orbit">
        🌐 Orbit View
      </button>
    </div>
  </header>

  <!-- Mars & Earth Location Selection Grid (Storyboard Layout) -->
  <section class="glass-panel location-selector-panel">
    <div class="selector-group">
      <div class="selector-label">MARS:</div>
      <button class="btn site-btn mars" data-site="mars_gale">
        <span class="site-icon">🔴</span>
        <span class="site-name">Gale Crater</span>
      </button>
    </div>

    <div class="selector-group" style="margin-top: 10px;">
      <div class="selector-label">EARTH:</div>
      <div class="earth-buttons-grid">
        <button class="btn site-btn lut btn-active" data-site="lut">
          <span class="site-icon">☀️</span>
          <span class="site-name">Lut Desert</span>
        </button>
        <button class="btn site-btn mcmurdo" data-site="mcmurdo">
          <span class="site-icon">❄️</span>
          <span class="site-name">McMurdo Dry Valleys</span>
        </button>
        <button class="btn site-btn aralkum" data-site="aralkum">
          <span class="site-icon">🏜️</span>
          <span class="site-name">Aralkum Desert</span>
        </button>
        <button class="btn site-btn uyuni" data-site="uyuni">
          <span class="site-icon">🧂</span>
          <span class="site-name">Salar de Uyuni</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Active Location Explorer Panel -->
  <main class="glass-panel main-explorer-panel" id="main-explorer-panel">

    <!-- Active Site Title & Regional Station Pills -->
    <div class="active-site-header">
      <div class="active-site-info">
        <h2 id="active-site-title">Lut Desert (Dasht-e Lut)</h2>
        <div id="active-site-subtitle" class="active-site-subtitle">
          Kerman / Sistan, Iran — 4,018 Daily Observations (2015–2025)
        </div>
      </div>
      <div class="station-pills-row" id="station-pills-row">
        <!-- Station buttons: Gandom Beryan [LUT-01], etc. -->
      </div>
    </div>

    <!-- Overall Comparison to Mars (Right before Biology as requested in Storyboard) -->
    <div class="mars-comparison-bar" id="mars-comparison-bar">
      <button id="btn-toggle-mars-comparison" class="btn btn-comparison-mars" title="Toggle overall cross-category comparison with Mars Gale Crater">
        <div class="comp-btn-left">
          <span class="comp-icon">🪐</span>
          <span class="comp-title" id="comp-title-text">Comparison to Mars (All Categories)</span>
        </div>
        <div class="comp-btn-right">
          <span class="comp-badge">3D Viewport HUD</span>
          <span class="comp-arrow" id="comp-arrow">▶</span>
        </div>
      </button>
    </div>

    <!-- Storyboard Categories & Data Points Container -->
    <div class="categories-container" id="categories-container">
      <!-- Injected dynamically by app.js:
           - Astro-Biology / Biology
           - Temperature
           - Wind & Atmosphere
           - Moisture & Relative Humidity
           - Solar Radiation
           Each data point has switch -> [◉ Overview] [○ Overlay] [ ] Orient Sideways
      -->
    </div>

  </main>

  <!-- Automated Camera Tour (Preserved at the bottom as requested) -->
  <section class="glass-panel tour-panel">
    <div class="tour-header">
      <div class="tour-title-box">
        <h3>Automated Camera Tour</h3>
        <span style="font-size: 0.72rem; color: var(--text-muted);">Cycles all planetary analogs</span>
      </div>
    </div>
    <div class="btn-group" style="align-items: center; margin-top: 8px;">
      <button id="btn-tour-play" class="btn btn-primary">▶ Start Tour</button>
      <button id="btn-tour-pause" class="btn">⏸ Pause</button>
      <button id="btn-tour-prev" class="btn">⏮ Prev</button>
      <button id="btn-tour-next" class="btn">⏭ Next</button>
      <select id="sel-tour-speed" class="btn" style="padding: 5px 8px;">
        <option value="0.5">Speed: 0.5x</option>
        <option value="1.0" selected>Speed: 1.0x</option>
        <option value="1.5">Speed: 1.5x</option>
        <option value="2.0">Speed: 2.0x</option>
      </select>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/team-data.js?v=6.1.0"></script>
  <script src="js/openspace-api.js?v=6.1.0"></script>
  <script src="js/app.js?v=6.1.0"></script>
</body>
</html>
